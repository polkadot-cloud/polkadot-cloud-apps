packages:
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  bufferutil: true
  esbuild: true
  keccak: true
  node-hid: true
  sharp: true
  unrs-resolver: true
  usb: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - '@polkadot-cloud/util-dedot@0.1.0'
  - '@polkadot-cloud/hooks@0.1.0'
patchedDependencies:
  '@dedot/api@1.4.0': patches/@dedot__api@1.4.0.patch
